<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auron | Clínica Estética VIP Bogotá</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        /* Reset y Base */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; color: #333; overflow-x: hidden; }

        /* Navegación Superior */
        nav {
            position: absolute;
            top: 0; width: 100%;
            padding: 30px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 600;
            color: #fff;
            letter-spacing: 2px;
        }
        .nav-links { list-style: none; display: flex; gap: 30px; }
        .nav-links li a {
            color: #fff;
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }
        .nav-links li a:hover { color: #c7a36b; }

        /* Sección Hero (Imagen de fondo) */
        .hero {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: url('https://images.unsplash.com/photo-1616394584738-fc6e612e71b9?q=80&w=2070&auto=format&fit=crop') no-repeat center center/cover;
        }
        
        /* Capa oscura para que el texto resalte */
        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); 
            z-index: 1; /* Nivel 1 */
        }

        /* Contenido Central */
        .hero-content {
            position: relative;
            z-index: 2; /* Nivel 2 */
            max-width: 800px;
            padding: 0 20px;
        }
        .hero-content h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4.5rem;
            color: #fff;
            margin-bottom: 20px;
            font-weight: 400;
        }
        .hero-content h1 span { color: #c7a36b; font-style: italic; }
        .hero-content p {
            font-size: 1.2rem;
            color: #f8f8f8;
            margin-bottom: 40px;
            line-height: 1.6;
            font-weight: 300;
        }

        /* LA SOLUCIÓN: Forzar el botón de Vapi al frente absoluto */
        vapi-chat-widget, #vapi-chat-widget {
            z-index: 99999 !important; /* Nivel Máximo */
            position: fixed !important;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">AURON</div>
        <ul class="nav-links">
            <li><a href="#">Inicio</a></li>
            <li><a href="#">Tratamientos</a></li>
            <li><a href="#">Instalaciones</a></li>
            <li><a href="#">Contacto</a></li>
        </ul>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <h1>Descubre tu <span>mejor versión</span></h1>
            <p>Bienvenido a la experiencia VIP en estética avanzada. Deja que Lu, nuestra agente virtual, gestione tu cita y responda tus dudas ahora mismo.</p>
        </div>
    </header>

    <script>
      var vapiInstance = null;
      const assistant = "c3f7a846-f79a-49d0-ace3-a99e6d1ebe98"; 
      const apiKey = "da74cce1-415a-48cf-bf99-f20520b48d22"; 

      (function (d, t) {
        var g = d.createElement(t), s = d.getElementsByTagName(t)[0];
        g.src = "https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";
        g.defer = true; g.async = true;
        s.parentNode.insertBefore(g, s);
        
        g.onload = function () {
          window.vapiSDK.run({ 
              apiKey: apiKey, 
              assistant: assistant,
              config: {
                  position: "bottom-right",
                  button: {
                      color: "#c7a36b" // Color dorado VIP
                  }
              }
          });
        };
      })(document, "script");
    </script>
</body>
</html>
